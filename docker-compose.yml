version: '3.8'

services:
  front:
    build: ./front
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - back

  back:
    build: ./back
    ports:
      - "8000:80"
    volumes:
      - ./back:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=miapp
      - DB_USER=root
      - DB_PASS=root

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: miapp
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data: